# riftden.com: TLS с сертификатом Cloudflare Origin (режим Full strict), запросы — сайту.

# Адрес посетителя для Plausible: Cloudflare присылает его в CF-Connecting-IP.
map $http_cf_connecting_ip $riftden_client_ip {
  default $http_cf_connecting_ip;
  ""      $remote_addr;
}

# прямые заходы по IP и чужие домены — без ответа
server {
  listen 443 ssl default_server;
  ssl_reject_handshake on;
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.riftden.com;
  ssl_certificate /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin-key.pem;
  return 301 https://riftden.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name riftden.com;
  ssl_certificate /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # Immutable hashed Next assets may be cached for a year; HTML/data keep Next headers.
  location /_next/static/ {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Медиа образов (3D-модели, озвучка, картинки) — готовит tools/media-pipeline в /opt/riftden/media.
  # Пути содержат номер патча и не меняются, поэтому кэш на год; current.json — указатель на патч, без кэша.
  # служебное конвейера: незаконченные прогоны, состояние, отчёты
  location ~ ^/media/(.*/)?(\.[^/]*|[^/]+\.partial(/.*)?|report\.json|SITE_PATCH)$ {
    return 404;
  }

  location /media/ {
    alias /srv/media/;
    access_log off;
    types {
      model/gltf-binary glb;
      application/json json;
      audio/ogg ogg;
      audio/mpeg mp3;
      video/webm webm;
      image/webp webp;
      image/avif avif;
      image/png png;
      image/jpeg jpg;
      image/ktx2 ktx2;
    }
    gzip_types application/json model/gltf-binary;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    location = /media/current.json {
      add_header Cache-Control "public, max-age=300";
      add_header X-Content-Type-Options nosniff;
    }
  }

  # Plausible CE (общий с gildra.net, /opt/plausible): только скрипт и приём событий со своего домена.
  # Адрес апстрима резолвится на каждый запрос, чтобы nginx стартовал и без Plausible.
  location = /stats/js/script.js {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $plausible_upstream http://plausible:8000;
    proxy_pass $plausible_upstream/js/script.js;
    proxy_set_header Host $host;
  }

    location = /stats/js/script.exclusions.js {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $plausible_upstream http://plausible:8000;
    proxy_pass $plausible_upstream/js/script.exclusions.js;
    proxy_set_header Host $host;
  }

  location = /stats/api/event {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $plausible_upstream http://plausible:8000;
    proxy_pass $plausible_upstream/api/event;
    proxy_set_header Host $host;
    proxy_set_header X-Plausible-IP $riftden_client_ip;
    proxy_set_header X-Forwarded-For $riftden_client_ip;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }
}
